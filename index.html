<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Our Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#F4F6F2; --card:#fff; --line:#DFE5DC; --ink:#1E2723; --faint:#6E7A72;
    --green:#17362C; --green-soft:#24493C; --p0:#DFA126; --p1:#4479A8; --danger:#B0432F;
    --font:'Archivo',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--font); }
  button { font-family:var(--font); cursor:pointer; }
  input, select { font-family:var(--font); font-size:16px; color:var(--ink); }
  :focus-visible { outline:2px solid var(--p1); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

  .hidden { display:none !important; }
  .label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
  .input { width:100%; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; }
  .mono { font-family:var(--mono); }
  .chip { padding:9px 14px; border-radius:999px; font-size:14px; font-weight:600; border:1.5px solid var(--line); background:var(--card); color:var(--ink); transition:all .15s; }
  .chip.on { background:var(--green); border-color:var(--green); color:#fff; }
  .chip.on.c0 { background:var(--p0); border-color:var(--p0); }
  .chip.on.c1 { background:var(--p1); border-color:var(--p1); }
  .chiprow { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { width:100%; padding:14px; border-radius:12px; border:none; background:var(--green); color:#fff; font-size:15px; font-weight:700; }
  .btn[disabled] { background:var(--line); color:var(--faint); cursor:default; }
  .btn.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .gap { height:14px; }

  /* login */
  #login { min-height:100vh; background:var(--green); display:flex; align-items:center; justify-content:center; padding:24px; }
  #login .inner { width:100%; max-width:400px; }
  #login h1 { color:#fff; font-size:32px; font-weight:800; line-height:1.15; margin:10px 0 24px; }
  #login .eyebrow { font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:rgba(255,255,255,.7); }
  #login .panel { background:var(--card); border-radius:16px; padding:20px; }
  #loginErr { color:var(--danger); font-size:13.5px; margin-top:10px; min-height:18px; }

  /* header */
  header { background:var(--green); color:#fff; padding:18px 18px 22px; }
  header .inner { max-width:560px; margin:0 auto; }
  header .toprow { display:flex; align-items:center; justify-content:space-between; }
  header .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.18em; opacity:.75; }
  header .iconbtn { border:none; background:rgba(255,255,255,.12); color:#fff; border-radius:8px; padding:6px 10px; font-size:13px; }
  header .sub { margin-top:14px; font-size:13px; opacity:.75; }
  header .total { font-family:var(--mono); font-size:32px; font-weight:700; margin:2px 0 12px; }
  header .splitwrap { background:rgba(255,255,255,.08); border-radius:12px; padding:12px 14px; }

  .splitbar { display:flex; height:10px; border-radius:999px; overflow:hidden; background:var(--line); }
  .splitbar .s0 { background:var(--p0); transition:width .4s; }
  .splitbar .s1 { background:var(--p1); flex:1; }
  .splitnames { display:flex; justify-content:space-between; margin-top:8px; font-size:13px; }
  .splitnames .dot { display:inline-block; width:9px; height:9px; border-radius:99px; margin-right:6px; }

  main { max-width:560px; margin:0 auto; padding:16px 16px 90px; }

  /* rows */
  .row { border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .rowmain { display:flex; align-items:center; gap:12px; padding:12px 4px; cursor:pointer; }
  .rowbar { width:4px; align-self:stretch; border-radius:4px; }
  .rowdesc { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rowsub { font-size:12.5px; color:var(--faint); margin-top:2px; }
  .rowamt { font-family:var(--mono); font-weight:600; font-size:15px; }
  .rowdetail { padding:0 4px 12px 20px; font-size:13px; color:var(--faint); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .linkbtn { border:none; background:none; font-weight:700; font-size:13px; padding:0; }
  .listbox { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:4px 14px; }
  .empty { padding:16px; color:var(--faint); font-size:14px; }

  /* toggle */
  .toggle { width:44px; height:26px; border-radius:999px; border:none; background:var(--line); position:relative; transition:background .15s; flex:none; }
  .toggle.on { background:var(--green); }
  .toggle span { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:99px; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .toggle.on span { left:21px; }

  /* insights */
  .catrow { margin-bottom:10px; }
  .cathead { display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px; }
  .cattrack { height:8px; border-radius:99px; background:var(--paper); }
  .catfill { height:8px; border-radius:99px; background:var(--green-soft); }
  .lline { display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px solid var(--paper); }
  .trend { display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:6px; }
  .trendcol { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .trendbar { width:100%; max-width:34px; border-radius:6px 6px 2px 2px; background:var(--line); transition:height .3s; }
  .trendbar.now { background:var(--green); }
  .trendv { font-family:var(--mono); font-size:10px; color:var(--faint); }
  .trendm { font-size:10.5px; color:var(--faint); }

  /* tabs */
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); z-index:40; }
  nav .inner { display:flex; max-width:560px; margin:0 auto; }
  nav button { flex:1; padding:13px 0 max(13px, env(safe-area-inset-bottom)); border:none; background:none; font-size:14px; font-weight:700; color:var(--faint); border-top:3px solid transparent; }
  nav button.on { color:var(--green); border-top-color:var(--green); }

  .amountwrap { display:flex; align-items:center; gap:8px; border-bottom:2px solid var(--line); padding-bottom:6px; margin-bottom:16px; }
  .amountwrap .cur { font-family:var(--mono); font-size:22px; color:var(--faint); }
  #fAmount { border:none; outline:none; font-size:30px; font-family:var(--mono); font-weight:600; width:100%; background:transparent; }
  .two { display:flex; gap:12px; } .two > div { flex:1; }
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<section id="login">
  <div class="inner">
    <div class="eyebrow">SHARED LEDGER · PRIVATE</div>
    <h1>Sign in to<br />your ledger.</h1>
    <div class="panel">
      <div class="label">Email</div>
      <input class="input" id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" />
      <div class="gap"></div>
      <div class="label">Password</div>
      <input class="input" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div id="loginErr"></div>
      <button class="btn" id="loginBtn">Sign in</button>
    </div>
  </div>
</section>

<!-- ======================= APP ======================= -->
<div id="app" class="hidden">
  <header>
    <div class="inner">
      <div class="toprow">
        <div class="eyebrow" id="headNames"></div>
        <div style="display:flex;gap:6px">
          <button class="iconbtn" id="csvBtn" title="Download CSV">CSV</button>
          <button class="iconbtn" id="syncBtn" title="Refresh">⟳</button>
          <button class="iconbtn" id="logoutBtn" title="Sign out">Sign out</button>
        </div>
      </div>
      <div class="sub" id="headMonth"></div>
      <div class="total" id="headTotal"></div>
      <div class="splitwrap" id="headSplit"></div>
      <div class="gap" style="height:10px"></div>
      <div class="splitwrap" id="headBalance"></div>
    </div>
  </header>

  <main>
    <!-- ADD -->
    <section id="pane-add">
      <div class="box" id="formBox">
        <div class="label">Amount</div>
        <div class="amountwrap"><span class="cur" id="curSym"></span><input id="fAmount" inputmode="decimal" placeholder="0" /></div>
        <div class="label">What was it for?</div>
        <input class="input" id="fDesc" placeholder="e.g. Groceries at DMart, Netflix, Auto fare" />
        <div class="gap"></div>
        <div class="two">
          <div><div class="label">Date</div><input class="input" id="fDate" type="date" /></div>
          <div><div class="label">Category</div><select class="input" id="fCat"></select></div>
        </div>
        <div class="gap"></div>
        <div class="label">Paid by</div>
        <div class="chiprow" id="fPaidBy"></div>
        <div class="gap"></div>
        <div class="label">Payment mode</div>
        <div class="chiprow" id="fMode"></div>
        <div id="cardWrap" class="hidden" style="margin-top:14px">
          <div class="label">Which card</div>
          <input class="input" id="fCard" placeholder="e.g. HDFC Millennia, SBI Cashback" />
        </div>
        <div style="margin-top:16px">
          <div class="label">Split this expense?</div>
          <div class="chiprow" id="fSplit"></div>
          <div id="splitPreview" class="rowsub" style="margin-top:8px"></div>
          <div id="customSplitWrap" class="hidden two" style="margin-top:12px">
            <div><div class="label" id="fShare0Label"></div><input class="input" id="fShare0" inputmode="decimal" /></div>
            <div><div class="label" id="fShare1Label"></div><input class="input" id="fShare1" inputmode="decimal" /></div>
          </div>
          <div id="splitErr" style="font-size:12.5px;color:var(--danger);margin-top:6px"></div>
        </div>
        <div style="margin-top:16px;display:flex;align-items:center;gap:10px">
          <button class="toggle" id="fRecurring" aria-pressed="false"><span></span></button>
          <span style="font-size:14px;font-weight:600">Monthly subscription / recurring</span>
        </div>
        <div style="margin-top:14px">
          <div class="label">Note (optional)</div>
          <input class="input" id="fNote" placeholder="Any other detail" />
        </div>
        <div style="display:flex;gap:10px;margin-top:18px">
          <button class="btn ghost hidden" id="cancelBtn" style="flex:1">Cancel</button>
          <button class="btn" id="saveBtn" style="flex:2" disabled>Add expense</button>
        </div>
      </div>
      <div class="label">Recent</div>
      <div class="listbox" id="recentList"></div>
    </section>

    <!-- HISTORY -->
    <section id="pane-history" class="hidden">
      <select class="input" id="histMonth" style="font-weight:700;margin-bottom:10px"></select>
      <div class="chiprow" id="histPerson" style="margin-bottom:10px"></div>
      <select class="input" id="histCat" style="margin-bottom:12px"></select>
      <div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--faint);margin:0 4px 6px">
        <span id="histCount"></span><span class="mono" id="histTotal" style="font-weight:700;color:var(--ink)"></span>
      </div>
      <div class="listbox" id="histList"></div>
    </section>

    <!-- INSIGHTS -->
    <section id="pane-insights" class="hidden">
      <select class="input" id="insMonth" style="font-weight:700;margin-bottom:14px"></select>
      <div id="insBody"></div>
    </section>
    <!-- AUDIT LOG -->
    <section id="pane-audit" class="hidden">
      <div class="label">Change log — every add, edit &amp; delete</div>
      <div id="auditBody"></div>
    </section>
  </main>

  <nav>
    <div class="inner">
      <button data-tab="add" class="on">＋ Add</button>
      <button data-tab="history">History</button>
      <button data-tab="insights">Insights</button>
      <button data-tab="audit">Log</button>
    </div>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================
   EDIT THESE 4 THINGS, THEN DEPLOY
   ========================================================= */
const SUPABASE_URL      = "https://qesbyutgimiijccuyole.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlc2J5dXRnaW1paWpjY3V5b2xlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NTcxNzgsImV4cCI6MjEwMDAzMzE3OH0.qsnBGYb2IxWlDVVzhTi0OpFydhsYxydeKTo0CxzEs1g";
const PEOPLE = [
  { name: "Ayush", email: "tiwary.tiwaryayush@gmail.com" },
  { name: "Archie", email: "ranaarchana181@gmail.com" },
];
const CURRENCY = "₹";
/* ========================================================= */

const CATEGORIES = ["Food & Dining","Groceries","Transport","Rent & Home","Utilities & Bills","Subscriptions","Shopping","Health","Entertainment","Travel","Other"];
const MODES = ["Cash","UPI","Debit Card","Credit Card","Bank Transfer","Other"];
const CARD_MODES = ["Debit Card","Credit Card"];

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n) => Number(n).toLocaleString("en",{maximumFractionDigits:2});
const todayStr = () => new Date().toISOString().slice(0,10);
const monthOf = (d) => d.slice(0,7);
const monthLabel = (ym) => { const [y,m]=ym.split("-"); return new Date(+y,+m-1,1).toLocaleString("en",{month:"short",year:"numeric"}); };

let expenses = [];         // all rows, newest first
let editingId = null;
let tab = "add";
let openRow = null;
let sel = { paidBy: 0, mode: "UPI", recurring: false, split: false, splitMode: "no" };
let histMonth = monthOf(todayStr()), histPerson = -1, histCat = "All";
let insMonth = monthOf(todayStr());
let auditRows = [];

/* ---------------- auth ---------------- */
$("loginBtn").addEventListener("click", signIn);
$("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") signIn(); });

async function signIn() {
  const email = $("loginEmail").value.trim(), password = $("loginPass").value;
  if (!email || !password) { $("loginErr").textContent = "Enter your email and password."; return; }
  $("loginBtn").disabled = true; $("loginBtn").textContent = "Signing in…"; $("loginErr").textContent = "";
  const { error } = await db.auth.signInWithPassword({ email, password });
  $("loginBtn").disabled = false; $("loginBtn").textContent = "Sign in";
  if (error) $("loginErr").textContent = "Wrong email or password. Try again.";
}

$("logoutBtn").addEventListener("click", async () => { await db.auth.signOut(); });

db.auth.onAuthStateChange((_evt, session) => {
  if (session) {
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    const me = PEOPLE.findIndex(p => p.email.toLowerCase() === (session.user.email || "").toLowerCase());
    if (me >= 0) sel.paidBy = me;
    boot();
  } else {
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
  }
});

/* ---------------- data ---------------- */
async function fetchAll() {
  const { data, error } = await db.from("expenses").select("*")
    .order("date", { ascending:false }).order("created_at", { ascending:false });
  if (error) { alert("Could not load expenses: " + error.message); return; }
  expenses = data || [];
  const { data: audit } = await db.from("audit_log").select("*")
    .order("happened_at", { ascending:false }).limit(200);
  auditRows = audit || [];
  renderAll();
}

let booted = false;
function boot() {
  if (booted) { fetchAll(); return; }
  booted = true;
  buildStaticControls();
  fetchAll();
  db.channel("expenses-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"expenses" }, () => fetchAll())
    .subscribe();
}

async function saveExpense() {
  const amount = parseFloat($("fAmount").value);
  const description = $("fDesc").value.trim();
  if (!(amount > 0) || !description) return;
  if (!splitValid()) return;
  const [share_p0, share_p1] = splitShares();
  const rec = {
    amount, description,
    date: $("fDate").value || todayStr(),
    category: $("fCat").value,
    paid_by: PEOPLE[sel.paidBy].name,
    mode: sel.mode,
    card: CARD_MODES.includes(sel.mode) ? $("fCard").value.trim() : "",
    recurring: sel.recurring,
    note: $("fNote").value.trim(),
    split: sel.split,
    share_p0: sel.split ? share_p0 : null,
    share_p1: sel.split ? share_p1 : null,
  };
  $("saveBtn").disabled = true; $("saveBtn").textContent = "Saving…";
  const q = editingId
    ? db.from("expenses").update(rec).eq("id", editingId)
    : db.from("expenses").insert(rec);
  const { error } = await q;
  $("saveBtn").textContent = editingId ? "Save changes" : "Add expense";
  if (error) { alert("Could not save: " + error.message); $("saveBtn").disabled = false; return; }
  resetForm();
  await fetchAll();
}

async function deleteExpense(id) {
  const x = expenses.find(e => e.id === id);
  if (!x || !confirm(`Delete "${x.description}"?`)) return;
  const { error } = await db.from("expenses").delete().eq("id", id);
  if (error) { alert("Could not delete: " + error.message); return; }
  await fetchAll();
}

/* ---------------- form ---------------- */
function buildStaticControls() {
  $("curSym").textContent = CURRENCY;
  $("fDate").value = todayStr();
  $("fCat").innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join("");
  $("headNames").textContent = PEOPLE.map(p => p.name.toUpperCase()).join(" + ") + " · LEDGER";

  $("fPaidBy").innerHTML = PEOPLE.map((p,i) =>
    `<button class="chip c${i}" data-p="${i}">${esc(p.name)}</button>`).join("");
  $("fPaidBy").addEventListener("click", e => {
    const b = e.target.closest("[data-p]"); if (!b) return;
    sel.paidBy = +b.dataset.p; paintChips();
  });

  $("fMode").innerHTML = MODES.map(m => `<button class="chip" data-m="${m}">${m}</button>`).join("");
  $("fMode").addEventListener("click", e => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    sel.mode = b.dataset.m; paintChips();
  });

  $("fRecurring").addEventListener("click", () => {
    sel.recurring = !sel.recurring; paintChips();
  });

  $("fShare0Label").textContent = PEOPLE[0].name + "'s share";
  $("fShare1Label").textContent = PEOPLE[1].name + "'s share";
  $("fSplit").innerHTML =
    `<button class="chip" data-split="no">Just me</button>` +
    `<button class="chip" data-split="equal">Split equally</button>` +
    `<button class="chip" data-split="custom">Custom split</button>`;
  $("fSplit").addEventListener("click", e => {
    const b = e.target.closest("[data-split]"); if (!b) return;
    sel.splitMode = b.dataset.split;
    sel.split = sel.splitMode !== "no";
    if (sel.splitMode === "custom") {
      const [s0,s1] = splitShares();
      if (!$("fShare0").value) $("fShare0").value = s0 ? s0.toFixed(2) : "";
      if (!$("fShare1").value) $("fShare1").value = s1 ? s1.toFixed(2) : "";
    }
    paintChips(); validate();
  });
  ["fShare0","fShare1"].forEach(id => $(id).addEventListener("input", () => { validate(); renderSplitPreview(); }));

  ["fAmount","fDesc"].forEach(id => $(id).addEventListener("input", () => { validate(); renderSplitPreview(); }));
  $("saveBtn").addEventListener("click", saveExpense);
  $("cancelBtn").addEventListener("click", resetForm);
  $("syncBtn").addEventListener("click", fetchAll);
  $("csvBtn").addEventListener("click", exportCSV);

  $("histMonth").addEventListener("change", e => { histMonth = e.target.value; renderHistory(); });
  $("histCat").addEventListener("change", e => { histCat = e.target.value; renderHistory(); });
  $("histPerson").innerHTML =
    `<button class="chip" data-hp="-1">Both</button>` +
    PEOPLE.map((p,i) => `<button class="chip c${i}" data-hp="${i}">${esc(p.name)}</button>`).join("");
  $("histPerson").addEventListener("click", e => {
    const b = e.target.closest("[data-hp]"); if (!b) return;
    histPerson = +b.dataset.hp; renderHistory();
  });
  $("histCat").innerHTML = `<option>All</option>` + CATEGORIES.map(c => `<option>${c}</option>`).join("");
  $("insMonth").addEventListener("change", e => { insMonth = e.target.value; renderInsights(); });

  document.querySelectorAll("nav [data-tab]").forEach(b =>
    b.addEventListener("click", () => switchTab(b.dataset.tab)));

  document.addEventListener("click", e => {
    const edit = e.target.closest("[data-edit]");
    if (edit) { startEdit(edit.dataset.edit); return; }
    const del = e.target.closest("[data-del]");
    if (del) { deleteExpense(del.dataset.del); return; }
    const row = e.target.closest("[data-row]");
    if (row) { openRow = openRow === row.dataset.row ? null : row.dataset.row; renderLists(); }
  });

  paintChips(); validate();
}

function paintChips() {
  $("fPaidBy").querySelectorAll(".chip").forEach(b => b.classList.toggle("on", +b.dataset.p === sel.paidBy));
  $("fMode").querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.m === sel.mode));
  $("cardWrap").classList.toggle("hidden", !CARD_MODES.includes(sel.mode));
  $("fRecurring").classList.toggle("on", sel.recurring);
  $("fRecurring").setAttribute("aria-pressed", sel.recurring);
  $("fSplit").querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.split === sel.splitMode));
  $("customSplitWrap").classList.toggle("hidden", sel.splitMode !== "custom");
  renderSplitPreview();
}
function validate() {
  $("saveBtn").disabled = !(parseFloat($("fAmount").value) > 0 && $("fDesc").value.trim() && splitValid());
}
function resetForm() {
  editingId = null;
  $("fAmount").value = ""; $("fDesc").value = ""; $("fNote").value = ""; $("fCard").value = "";
  $("fShare0").value = ""; $("fShare1").value = "";
  $("fDate").value = todayStr(); $("fCat").value = CATEGORIES[0];
  sel.mode = "UPI"; sel.recurring = false; sel.split = false; sel.splitMode = "no";
  $("saveBtn").textContent = "Add expense"; $("saveBtn").disabled = true;
  $("cancelBtn").classList.add("hidden");
  paintChips();
}
function startEdit(id) {
  const x = expenses.find(e => e.id === id); if (!x) return;
  editingId = id;
  $("fAmount").value = x.amount; $("fDesc").value = x.description;
  $("fDate").value = x.date; $("fCat").value = x.category;
  sel.paidBy = Math.max(0, PEOPLE.findIndex(p => p.name === x.paid_by));
  sel.mode = x.mode; sel.recurring = !!x.recurring;
  sel.split = !!x.split;
  if (sel.split) {
    const s0 = Number(x.share_p0) || 0, s1 = Number(x.share_p1) || 0;
    const isEqual = Math.abs(s0 - s1) < 0.01 && Math.abs((s0 + s1) - Number(x.amount)) < 0.01;
    sel.splitMode = isEqual ? "equal" : "custom";
    $("fShare0").value = s0 ? s0.toFixed(2) : ""; $("fShare1").value = s1 ? s1.toFixed(2) : "";
  } else {
    sel.splitMode = "no"; $("fShare0").value = ""; $("fShare1").value = "";
  }
  $("fCard").value = x.card || ""; $("fNote").value = x.note || "";
  $("saveBtn").textContent = "Save changes";
  $("cancelBtn").classList.remove("hidden");
  paintChips(); validate();
  switchTab("add");
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ---------------- rendering ---------------- */
function switchTab(t) {
  tab = t;
  document.querySelectorAll("nav [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("pane-add").classList.toggle("hidden", t !== "add");
  $("pane-history").classList.toggle("hidden", t !== "history");
  $("pane-insights").classList.toggle("hidden", t !== "insights");
  $("pane-audit").classList.toggle("hidden", t !== "audit");
  renderAll();
}

function months() {
  const s = new Set(expenses.map(x => monthOf(x.date)));
  s.add(monthOf(todayStr()));
  return [...s].sort().reverse();
}
function personIdx(x) { const i = PEOPLE.findIndex(p => p.name === x.paid_by); return i < 0 ? 0 : i; }

/* ---------------- splitting ---------------- */
function computeBalance(rows) {
  // positive => PEOPLE[1] owes PEOPLE[0]; negative => PEOPLE[0] owes PEOPLE[1]
  let net = 0;
  rows.forEach(x => {
    if (!x.split) return;
    const payer = personIdx(x);
    const s0 = Number(x.share_p0) || 0, s1 = Number(x.share_p1) || 0;
    net += payer === 0 ? s1 : -s0;
  });
  return net;
}
function balanceHTML(net) {
  if (Math.abs(net) < 0.005) {
    return `<div style="font-size:13.5px;text-align:center">You're all settled up</div>`;
  }
  const owes = net > 0 ? PEOPLE[1] : PEOPLE[0];
  const owed = net > 0 ? PEOPLE[0] : PEOPLE[1];
  return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px">
    <span><b>${esc(owes.name)}</b> owes <b>${esc(owed.name)}</b></span>
    <span class="mono" style="font-weight:700;font-size:16px">${CURRENCY}${fmt(Math.abs(net))}</span>
  </div>`;
}
function splitLabel(x) {
  if (!x.split) return "";
  const payer = personIdx(x), other = 1 - payer;
  const shares = [Number(x.share_p0) || 0, Number(x.share_p1) || 0];
  const owed = shares[other];
  if (owed <= 0) return "Split";
  return `${esc(PEOPLE[other].name)} owes ${esc(PEOPLE[payer].name)} ${CURRENCY}${fmt(owed)}`;
}
function splitValid() {
  if (!sel.split) return true;
  if (sel.splitMode === "equal") return true;
  const amt = parseFloat($("fAmount").value);
  const s0 = parseFloat($("fShare0").value), s1 = parseFloat($("fShare1").value);
  if (!(s0 >= 0) || !(s1 >= 0) || !(amt > 0)) return false;
  return Math.abs((s0 + s1) - amt) < 0.01;
}
function splitShares() {
  const amt = parseFloat($("fAmount").value) || 0;
  if (sel.splitMode === "equal") { const h = amt / 2; return [h, h]; }
  if (sel.splitMode === "custom") return [parseFloat($("fShare0").value) || 0, parseFloat($("fShare1").value) || 0];
  return [null, null];
}
function renderSplitPreview() {
  const amt = parseFloat($("fAmount").value) || 0;
  if (sel.splitMode === "equal" && amt > 0) {
    const h = amt / 2;
    $("splitPreview").textContent = `${PEOPLE[0].name} ${CURRENCY}${fmt(h)} · ${PEOPLE[1].name} ${CURRENCY}${fmt(h)}`;
  } else {
    $("splitPreview").textContent = "";
  }
  $("splitErr").textContent = (sel.split && !splitValid() && sel.splitMode === "custom") ? "Shares must add up to the total amount." : "";
}
function splitBarHTML(byPerson) {
  const total = byPerson[0] + byPerson[1];
  const pct = total ? (byPerson[0] / total) * 100 : 50;
  return `<div class="splitbar">${total > 0 ? `<div class="s0" style="width:${pct}%"></div><div class="s1"></div>` : ""}</div>
    <div class="splitnames">${PEOPLE.map((p,i) =>
      `<span><span class="dot" style="background:var(--p${i})"></span><b>${esc(p.name)}</b>
       <span class="mono" style="color:${i===0?'inherit':'inherit'};opacity:.75">${CURRENCY}${fmt(byPerson[i])}</span></span>`).join("")}
    </div>`;
}
function rowHTML(x) {
  const i = personIdx(x);
  const d = new Date(x.date + "T00:00").toLocaleDateString("en",{day:"numeric",month:"short"});
  const open = openRow === x.id;
  return `<div class="row">
    <div class="rowmain" data-row="${x.id}">
      <span class="rowbar" style="background:var(--p${i})"></span>
      <div style="flex:1;min-width:0">
        <div class="rowdesc">${esc(x.description)} ${x.recurring ? "🔁" : ""} ${x.split ? "⇄" : ""}</div>
        <div class="rowsub">${d} · ${esc(x.category)} · ${esc(x.paid_by)}</div>
      </div>
      <div class="rowamt">${CURRENCY}${fmt(x.amount)}</div>
    </div>
    ${open ? `<div class="rowdetail">
        <span>${esc(x.mode)}${x.card ? " · " + esc(x.card) : ""}</span>
        ${x.split ? `<span>${splitLabel(x)}</span>` : ""}
        ${x.note ? `<span>“${esc(x.note)}”</span>` : ""}
        <span style="flex:1"></span>
        <button class="linkbtn" style="color:var(--green)" data-edit="${x.id}">Edit</button>
        <button class="linkbtn" style="color:var(--danger)" data-del="${x.id}">Delete</button>
      </div>` : ""}
  </div>`;
}
function fillMonthSelect(el, val) {
  el.innerHTML = months().map(m => `<option value="${m}" ${m===val?"selected":""}>${monthLabel(m)}</option>`).join("");
}

function renderHeader() {
  const tm = monthOf(todayStr());
  const rows = expenses.filter(x => monthOf(x.date) === tm);
  const total = rows.reduce((s,x) => s + Number(x.amount), 0);
  const byP = [0,1].map(i => rows.filter(x => personIdx(x) === i).reduce((s,x) => s + Number(x.amount), 0));
  $("headMonth").textContent = monthLabel(tm) + " so far";
  $("headTotal").textContent = CURRENCY + fmt(total);
  $("headSplit").innerHTML = splitBarHTML(byP);
  $("headBalance").innerHTML = balanceHTML(computeBalance(expenses));
}

function renderLists() {
  $("recentList").innerHTML = expenses.slice(0,6).map(rowHTML).join("")
    || `<div class="empty">No expenses yet. Add your first one above.</div>`;
  renderHistory();
}

function renderHistory() {
  fillMonthSelect($("histMonth"), histMonth);
  $("histPerson").querySelectorAll(".chip").forEach(b => b.classList.toggle("on", +b.dataset.hp === histPerson));
  const rows = expenses.filter(x =>
    monthOf(x.date) === histMonth &&
    (histPerson === -1 || personIdx(x) === histPerson) &&
    (histCat === "All" || x.category === histCat));
  $("histCount").textContent = rows.length + (rows.length === 1 ? " entry" : " entries");
  $("histTotal").textContent = CURRENCY + fmt(rows.reduce((s,x) => s + Number(x.amount), 0));
  $("histList").innerHTML = rows.map(rowHTML).join("") || `<div class="empty">Nothing matches these filters.</div>`;
}

function renderInsights() {
  fillMonthSelect($("insMonth"), insMonth);
  const rows = expenses.filter(x => monthOf(x.date) === insMonth);
  const total = rows.reduce((s,x) => s + Number(x.amount), 0);
  const byP = [0,1].map(i => rows.filter(x => personIdx(x) === i).reduce((s,x) => s + Number(x.amount), 0));

  const byCat = {}; rows.forEach(x => byCat[x.category] = (byCat[x.category]||0) + Number(x.amount));
  const cats = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;

  const byMode = {}; rows.forEach(x => {
    const k = x.card ? `${x.mode} · ${x.card}` : x.mode;
    byMode[k] = (byMode[k]||0) + Number(x.amount);
  });
  const modes = Object.entries(byMode).sort((a,b) => b[1]-a[1]);

  const subs = rows.filter(x => x.recurring);
  const subTotal = subs.reduce((s,x) => s + Number(x.amount), 0);

  const trend = [];
  const [ty,tm] = insMonth.split("-").map(Number);
  for (let k = 5; k >= 0; k--) {
    const d = new Date(ty, tm-1-k, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    trend.push([ym, expenses.filter(x => monthOf(x.date) === ym).reduce((s,x) => s + Number(x.amount), 0)]);
  }
  const maxT = Math.max(1, ...trend.map(t => t[1]));

  $("insBody").innerHTML = `
    <div class="box">
      <div class="label">Balance · all time</div>
      ${balanceHTML(computeBalance(expenses))}
    </div>
    <div class="box">
      <div class="label">Total spent · ${monthLabel(insMonth)}</div>
      <div class="mono" style="font-size:34px;font-weight:700;margin-bottom:16px">${CURRENCY}${fmt(total)}</div>
      ${splitBarHTML(byP)}
    </div>
    <div class="box">
      <div class="label">By category</div>
      ${cats.length ? cats.map(([c,v]) => `
        <div class="catrow">
          <div class="cathead"><b>${esc(c)}</b><span class="mono" style="color:var(--faint)">${CURRENCY}${fmt(v)}</span></div>
          <div class="cattrack"><div class="catfill" style="width:${(v/maxCat)*100}%"></div></div>
        </div>`).join("") : `<div class="empty" style="padding:0">Nothing yet this month.</div>`}
    </div>
    <div class="box">
      <div class="label">Subscriptions this month</div>
      ${subs.length ? subs.map(s => `
          <div class="lline"><span>🔁 ${esc(s.description)}</span><span class="mono">${CURRENCY}${fmt(s.amount)}</span></div>`).join("") +
        `<div class="lline" style="border:none;font-weight:700;padding-top:10px"><span>Total recurring</span><span class="mono">${CURRENCY}${fmt(subTotal)}</span></div>`
        : `<div class="empty" style="padding:0">No recurring expenses logged.</div>`}
    </div>
    <div class="box">
      <div class="label">By payment mode</div>
      ${modes.length ? modes.map(([m,v]) => `
        <div class="lline"><span>${esc(m)}</span><span class="mono">${CURRENCY}${fmt(v)}</span></div>`).join("")
        : `<div class="empty" style="padding:0">Nothing yet this month.</div>`}
    </div>
    <div class="box">
      <div class="label">Last 6 months</div>
      <div class="trend">
        ${trend.map(([ym,v]) => `
          <div class="trendcol">
            <div class="trendv">${v ? fmt(Math.round(v)) : ""}</div>
            <div class="trendbar ${ym===insMonth?"now":""}" style="height:${Math.max(3,(v/maxT)*70)}%"></div>
            <div class="trendm">${monthLabel(ym).split(" ")[0]}</div>
          </div>`).join("")}
      </div>
    </div>`;
}

/* ---------------- audit log ---------------- */
const FIELD_LABELS = { amount:"Amount", description:"Description", date:"Date", category:"Category", paid_by:"Paid by", mode:"Mode", card:"Card", recurring:"Recurring", note:"Note", split:"Split", share_p0:PEOPLE[0].name+"'s share", share_p1:PEOPLE[1].name+"'s share" };
function nameFor(email) {
  const p = PEOPLE.find(p => p.email.toLowerCase() === String(email || "").toLowerCase());
  return p ? p.name : (email || "Unknown");
}
function renderAudit() {
  if (!auditRows.length) {
    $("auditBody").innerHTML = `<div class="box empty">No changes recorded yet. Everything you add, edit or delete will show up here.</div>`;
    return;
  }
  $("auditBody").innerHTML = auditRows.map(a => {
    const who = esc(nameFor(a.changed_by_email));
    const when = new Date(a.happened_at).toLocaleString("en", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
    const o = a.old_data || {}, n = a.new_data || {};
    let title = "", detail = "";
    if (a.action === "INSERT") {
      title = `${who} added \u201C${esc(n.description)}\u201D`;
      detail = `${CURRENCY}${fmt(n.amount)} · ${esc(n.category)} · ${esc(n.date)}`;
    } else if (a.action === "DELETE") {
      title = `${who} deleted \u201C${esc(o.description)}\u201D`;
      detail = `was ${CURRENCY}${fmt(o.amount)} · ${esc(o.category)} · ${esc(o.date)}`;
    } else {
      title = `${who} edited \u201C${esc(n.description || o.description)}\u201D`;
      const changes = [];
      for (const f of Object.keys(FIELD_LABELS)) {
        let ov = o[f], nv = n[f];
        if (String(ov ?? "") !== String(nv ?? "")) {
          if (f === "amount" || f === "share_p0" || f === "share_p1") { ov = (ov == null ? ov : CURRENCY + fmt(ov)); nv = (nv == null ? nv : CURRENCY + fmt(nv)); }
          if (f === "recurring" || f === "split") { ov = ov ? "yes" : "no"; nv = nv ? "yes" : "no"; }
          const show = v => (v === "" || v == null) ? "\u2014" : esc(v);
          changes.push(`${FIELD_LABELS[f]}: ${show(ov)} \u2192 ${show(nv)}`);
        }
      }
      detail = changes.join(" · ") || "No visible change";
    }
    const tag = a.action === "INSERT" ? ["Added","var(--green)"] : a.action === "DELETE" ? ["Deleted","var(--danger)"] : ["Edited","var(--p1)"];
    return `<div class="box" style="padding:14px 16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--faint)">
        <span style="font-weight:700;letter-spacing:.04em;color:${tag[1]}">${tag[0]}</span>
        <span>${when}</span>
      </div>
      <div style="font-size:14.5px;font-weight:600;margin-top:4px">${title}</div>
      <div style="font-size:13px;color:var(--faint);margin-top:3px">${detail}</div>
    </div>`;
  }).join("");
}

function renderAll() { renderHeader(); renderLists(); renderInsights(); renderAudit(); }

/* ---------------- csv export ---------------- */
function exportCSV() {
  const head = "date,description,amount,category,paid_by,mode,card,recurring,note,split,"+PEOPLE[0].name+"_share,"+PEOPLE[1].name+"_share";
  const rows = [...expenses].sort((a,b) => a.date.localeCompare(b.date)).map(x =>
    [x.date, x.description, x.amount, x.category, x.paid_by, x.mode, x.card||"", x.recurring?"yes":"no", x.note||"", x.split?"yes":"no", x.share_p0 ?? "", x.share_p1 ?? ""]
      .map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(","));
  const blob = new Blob([[head, ...rows].join("\n")], { type:"text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "expenses.csv";
  a.click();
}
</script>
</body>
</html>
